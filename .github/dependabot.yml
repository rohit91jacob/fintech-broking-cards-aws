version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    # dbt-duckdb's iceberg plugin, pyiceberg and duckdb are a tested set, and the moto
    # transaction shim is written against moto 5.2: bump these deliberately.
    ignore:
      - dependency-name: moto
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: pyiceberg
      - dependency-name: dbt-duckdb
      - dependency-name: duckdb
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
