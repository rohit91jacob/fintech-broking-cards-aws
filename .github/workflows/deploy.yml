name: deploy

# Optional real-AWS deployment of infra/terraform. It never runs on its own: it is manual
# (workflow_dispatch), and it does nothing unless the repository variable AWS_DEPLOY_ROLE_ARN
# is set. Credentials come from GitHub OIDC federation (short-lived, no static keys); the
# role is created by infra/terraform/modules/ci_oidc and trusts only the aws-dev environment.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan (otherwise plan only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    name: deployment configured?
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -n "$ROLE" ] && [ -n "$BUCKET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_DEPLOY_ROLE_ARN / TF_STATE_BUCKET are not set; skipping deployment."
          fi

  terraform:
    name: terraform plan / apply
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: aws-dev
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "1"
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: fbc-deploy-${{ github.run_id }}
      - name: Build the Lambda package
        run: uv run --no-project python scripts/build_lambda_zip.py
      - name: terraform init (S3 backend with native locking)
        working-directory: infra/terraform
        run: |
          cat > backend_override.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=fintech-broking-cards-aws/dev.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: terraform plan
        working-directory: infra/terraform
        run: terraform plan -input=false -out=tfplan -var="region=${AWS_REGION}" -var="alert_email=${{ vars.ALERT_EMAIL }}"
      - name: terraform apply
        if: inputs.apply
        working-directory: infra/terraform
        run: terraform apply -input=false tfplan
